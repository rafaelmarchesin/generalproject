name: Projeto X - prévia no Firebase

# A cada pull request, publica o site num canal temporário do Firebase Hosting.
# As chamadas /api usam as funções já publicadas no projeto de desenvolvimento.
# Só roda depois de configurar no GitHub (Settings → Secrets and variables → Actions):
#   variável  PROJETO_X_FIREBASE_DEV    = id do projeto de desenvolvimento (ex.: projetox-dev)
#   segredo   PROJETO_X_FIREBASE_SA_DEV = JSON da conta de serviço desse projeto
on:
  pull_request:
    paths: ['projetos/projeto-x/**', 'compartilhado/**', 'pnpm-lock.yaml']

jobs:
  previa:
    if: ${{ vars.PROJETO_X_FIREBASE_DEV != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm x:hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PROJETO_X_FIREBASE_SA_DEV }}
          projectId: ${{ vars.PROJETO_X_FIREBASE_DEV }}
          entryPoint: projetos/projeto-x
          expires: 14d
